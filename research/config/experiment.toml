# Experiment configuration. Every script reads this file; change values here,
# not in code. Dates are first-of-month (YYYY-MM).

[project]
seed = 20261024
bootstrap_reps = 2000
countries = ["AZE", "DZA", "KAZ", "RUS", "NOR"]
country_names = { AZE = "Azerbaijan", DZA = "Algeria", KAZ = "Kazakhstan", RUS = "Russia", NOR = "Norway" }

[data]
# Analysis A (maximum coverage) starts at the project's stated research window
# (2000) or the first available month, whichever is later. 1995-1999 IMF
# observations exist for AZE/KAZ/RUS/NOR but are excluded (exit from
# post-Soviet hyperinflation; outside the 2000-2026 research window).
analysis_a_start = "2000-01"
# Analysis B (common period): longest overlap across all five countries.
analysis_b_start = "2005-01"
analysis_b_end = "2026-08"

[forecast]
horizons = [1, 3, 6, 12]
season_length = 12
# Hyper-parameters are chosen on validation targets only; test targets are
# never used for selection.
validation_start = "2016-01"
validation_end = "2018-12"
test_start = "2019-01"
# SARIMA/ETS parameters are re-estimated every January (expanding window) and
# the state is updated monthly with fixed parameters between re-estimations.
refit_every_months = 12
interval_levels = [0.80, 0.95]
subperiods = { "2019-2020" = ["2019-01", "2020-12"], "2021-2023" = ["2021-01", "2023-12"], "2024-2026" = ["2024-01", "2026-12"] }

[sarima]
p = [0, 1, 2]
q = [0, 1]
P = [0, 1]
Q = [0, 1]
d = [0]
D = [0]

[fuzzy]
interval_methods = ["average", "distribution"]

[household]
# Laspeyres price reference period = weight reference period (2025 average).
price_reference_year = 2025
weight_year = 2025
